<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <rect width="1800" height="1200" fill="#f6f7f4"/>
  <text x="90" y="120" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="72" font-weight="700" fill="#141817">Three Product Ideas</text>
  <text x="92" y="175" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="32" fill="#56605d">SoundMap, Tennitus, and StoryPose: turning messy personal data or ideas into structured visual workflows.</text>

  <g transform="translate(90 255)">
    <rect width="520" height="790" rx="28" fill="#ffffff" stroke="#b9cbd0" stroke-width="3"/>
    <circle cx="130" cy="130" r="58" fill="#dceff5"/>
    <circle cx="104" cy="118" r="9" fill="#226a7b"/>
    <circle cx="145" cy="155" r="9" fill="#226a7b"/>
    <circle cx="174" cy="101" r="9" fill="#226a7b"/>
    <path d="M104 118 C130 96, 150 96, 174 101 M104 118 C116 142, 130 151, 145 155 M145 155 C160 134, 170 118, 174 101" fill="none" stroke="#226a7b" stroke-width="7"/>
    <text x="55" y="245" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="52" font-weight="700" fill="#18323a">SoundMap</text>
    <text x="55" y="305" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="28" fill="#385a61">Your music library, mapped.</text>
    <text x="55" y="390" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" fill="#1f2d30">Spotify playlists become an</text>
    <text x="55" y="430" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" fill="#1f2d30">interactive 2D landscape based</text>
    <text x="55" y="470" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" fill="#1f2d30">on genre, artist, playlist, and</text>
    <text x="55" y="510" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" fill="#1f2d30">taste similarity.</text>
    <rect x="55" y="610" width="410" height="58" rx="16" fill="#e7f2f4"/>
    <text x="84" y="648" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="24" fill="#226a7b">MVP: shareable music map</text>
  </g>

  <g transform="translate(640 255)">
    <rect width="520" height="790" rx="28" fill="#ffffff" stroke="#bfd8d6" stroke-width="3"/>
    <circle cx="130" cy="130" r="58" fill="#dff3f0"/>
    <path d="M123 88c29 0 53 24 53 53 0 38-34 52-34 80" fill="none" stroke="#12736c" stroke-width="13" stroke-linecap="round"/>
    <path d="M142 140c0-11-9-20-20-20s-20 9-20 20" fill="none" stroke="#12736c" stroke-width="13" stroke-linecap="round"/>
    <text x="55" y="245" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="52" font-weight="700" fill="#102524">Tennitus</text>
    <text x="55" y="305" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="28" fill="#42615f">Tinnitus tracking and reports.</text>
    <text x="55" y="390" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" fill="#183331">Daily check-ins, spike logs,</text>
    <text x="55" y="430" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" fill="#183331">trigger context, weekly insights,</text>
    <text x="55" y="470" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" fill="#183331">masking sounds, and audiologist</text>
    <text x="55" y="510" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" fill="#183331">or GP-ready PDF reports.</text>
    <rect x="55" y="610" width="410" height="58" rx="16" fill="#eaf6f5"/>
    <text x="84" y="648" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="24" fill="#12736c">MVP: 14-day report workflow</text>
  </g>

  <g transform="translate(1190 255)">
    <rect width="520" height="790" rx="28" fill="#ffffff" stroke="#d9c7a5" stroke-width="3"/>
    <g transform="translate(70 78)" stroke="#7b4d1d" stroke-width="12" stroke-linecap="round" fill="none">
      <circle cx="68" cy="30" r="24" fill="#f4dec0" stroke="#7b4d1d"/>
      <path d="M68 58v93"/>
      <path d="M68 94l-56 41"/>
      <path d="M68 94l62-31"/>
      <path d="M68 151l-52 69"/>
      <path d="M68 151l58 68"/>
    </g>
    <text x="55" y="245" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="52" font-weight="700" fill="#221b13">StoryPose</text>
    <text x="55" y="305" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="28" fill="#66533a">Pose references from prompts.</text>
    <text x="55" y="390" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" fill="#2f281e">Creators describe character,</text>
    <text x="55" y="430" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" fill="#2f281e">action, emotion, camera angle,</text>
    <text x="55" y="470" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" fill="#2f281e">and scene, then get reusable</text>
    <text x="55" y="510" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" fill="#2f281e">visual pose boards.</text>
    <rect x="55" y="610" width="410" height="58" rx="16" fill="#f7ecd9"/>
    <text x="84" y="648" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="24" fill="#7b4d1d">MVP: prompt-to-pose sheets</text>
  </g>
</svg>
